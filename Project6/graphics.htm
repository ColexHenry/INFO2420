<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Native Cooking - Graphics</title>

<style>
	#thumbs, #image {
	width: 700px; 
	border: solid 1px
	#000; 
	text-align: center; 
	margin:
	0 auto 0 auto; 
	color: #000;
	background: #eee; 
	padding: 5px;
	}

	.center {
		display: flex;
		margin-top: auto;
		align-items: center;
		justify-content: center;
	}

	#thumbs {
	margin-top: 10px;
	}

	#thumbs img {
	border: solid 1px
	#000; margin:
	5px;
	}

	#image{
	height:400px;
	}

	.instructions{
	font-style:italic;
	}
</style>

<script>

	PrintButton1 = new Image
	PrintButton2 = new Image
	logo1 = new Image
	logo2 = new Image
if (document.images) {
	PrintButton1.src = "Images/Print1.jpg"
	PrintButton2.src = "Images/Print2.jpg"
	logo1.src = "Images/Logo1.png"
	logo2.src = "Images/Logo2.jpg"
}


		var imgArray = new Array(
			'Image1Lg.jpg',
			'Image2Lg.jpg',
			'Image3Lg.jpg',
			'Image4Lg.jpg'
			

		);


		var titleArray = new Array(
			'Woman eating Salad',
			'Cherry Pie',
			'Wine and Grapes',
			'Chef and Garnish'
			
		);
			
		var imgPath = "Images/Fullsize/";
		
		function swapImage(imgID) {

			var theImage = document.getElementById('theImage');
			var textDiv = document.getElementById('bottomText');

			var newImg;
			var textTitle;

			newImg = imgArray[imgID];
			theImage.src = imgPath + newImg;

			textTitle=titleArray[imgID];

      			textDiv.innerHTML = textTitle;
		}
			
		function preloadImages() {		
			for(var i = 0; i < imgArray.length; i++) {
				var tmpImg = new Image;
				tmpImg.src = imgPath + imgArray[i];
			}
		}
</script>

</head>
<body  onload="preloadImages()">

<!--Print Button-->
<div class="center">
	<a href="" onmouseover="document.getElementById('print').src='Images/Print2.jpg';"
	onmouseout="document.getElementById('print').src='Images/Print1.jpg';">
	<img src="Images/Print1.jpg" alt="Print Page" width="200" height="50"
	id="print"></a>
</div>

<br>


<!--Logo Switch-->
<div class="center">
	<a href="" onmouseover="document.getElementById('logo').src='Images/Logo2.jpg';"
	onmouseout="document.getElementById('logo').src='Images/Logo1.png';">
	<img src="Images/Logo1.png" alt="Logo" id="logo"></a>
</div>


<br>
<br>


<div id="thumbs">
	<img src="Images/Thumbnails/image1sm.jpg" alt="Woman eating a Salad" onmouseover="swapImage(0);">
	<img src="Images/Thumbnails/image2sm.jpg" alt="Cherry Pie" onmouseover="swapImage(1);">
	<img src="Images/Thumbnails/image3sm.jpg" alt="Wine and Grapes" onmouseover="swapImage(2);">
	<img src="Images/Thumbnails/image4sm.jpg" alt="Chef and Garnish" onmouseover="swapImage(3);">
</div>

	<div id="image">
		<img id="theImage" src="Images/FullSize/Image1Lg.jpg" alt="Woman eating a Salad">
		<h1 id="bottomText">Woman eating a Salad</h1>
	</div>

<br>
<br>
<br>
<br>

<div class="center">
<img src="Images/2colback.jpg" alt="a background image with dark blue and subdued yellow">
</div>


<br>
<br>
<br>
<br>

<p>
    <a href="http://validator.w3.org/check?uri=referer">
	<img src="http://www.w3.org/Icons/valid-xhtml10" alt="Valid XHTML 1.0 Transitional" height="31" width="88">
	</a>
</p>
  

</body>
</html>
